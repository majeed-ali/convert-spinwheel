# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "6abc51f0fb1a1e9b28cf12358a7dae89"
application_url = "https://spinwheel.app.sirpisoftwares.com"
embedded = true
name = "ConvertSpin-Spin-wheel-popup"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_metaobjects,write_metaobject_definitions,write_discounts,read_discounts,write_customers,read_customers"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions_update"
  topics = [ "app/subscriptions_update" ]

[auth]
redirect_urls = [
  "https://spinwheel.app.sirpisoftwares.com/auth/callback",
  "https://spinwheel.app.sirpisoftwares.com/auth/shopify/callback",
  "https://spinwheel.app.sirpisoftwares.com/api/auth"
]

[app_proxy]
url = "/api/public"
subpath = "convert-spin"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
